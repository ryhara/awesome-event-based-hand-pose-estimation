# Single source of truth for README.md, the per-task pages in tasks/ and the GitHub Pages site.
# All of them are generated by scripts/build.py (run automatically by GitHub Actions).
#
# Entry format:
#
#   - title: Paper Title                # required
#     authors: [First Author, Second Author]   # required
#     venue: CVPR                       # required, short name (use "arXiv" for preprints)
#     year: 2024                        # required, publication year
#     type: conference                  # required: conference | journal | workshop | preprint
#     task: [pose, dataset]             # required, one or more of the TASKS listed in scripts/build.py:
#                                       #   pose | mesh | tracking | detection | segmentation |
#                                       #   gesture recognition | sign language | action recognition |
#                                       #   dataset | simulation
#     doi: 10.1109/xxxx                 # optional, DOI or full URL
#     project: https://...              # optional, project page URL
#     arxiv: 2403.07346                 # optional, arXiv ID or full URL
#     code: https://github.com/...      # optional, code URL
#     tags: [egocentric, dataset]       # optional, free-form keywords (filterable on the site)
#
# Papers are grouped by year (newest first); within a year the order in this file is kept.

